<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111218"><title>猜歌練習機 🎧</title><style>
:root{color-scheme:dark;--bg:#101116;--surface:#1a1c25;--muted:#aab0bd;--line:#333743;--accent:#d4f5e5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fafafa;font:16px -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding:26px 17px 60px}.wrap{max-width:550px;margin:auto}h1{font-size:28px;margin:0 0 8px}.subtitle{color:var(--muted);font-size:14px;margin-bottom:22px}.card{background:var(--surface);border:1px solid var(--line);padding:19px;border-radius:22px;margin-bottom:14px}button,input{font:inherit;border-radius:13px}button{padding:14px;border:0;background:#343847;color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.4}button.primary{background:var(--accent);color:#14211c}button.secondary{background:#343847}button.mini{padding:9px;font-size:13px}input{width:100%;background:#101116;color:white;border:1px solid #414758;padding:13px}.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}.muted{color:var(--muted)}.small{font-size:13px}.status{font-size:14px;line-height:1.6;margin:12px 0}.progress{height:9px;border-radius:20px;background:#303541;overflow:hidden;margin:14px 0}.progress>div{height:100%;width:10%;background:var(--accent);transition:width .2s}.large{font-size:37px;font-weight:800;text-align:center;margin:9px 0}.choices{display:grid;gap:8px;max-height:260px;overflow:auto;margin-top:9px}.choice{width:100%;text-align:left;font-size:14px;padding:12px;background:#292e39;border:1px solid #3a414e}.choice.selected{background:#294b40;border-color:#a8e3c5}.answer{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.answer img{width:90px;height:90px;object-fit:cover;border-radius:11px;float:left;margin-right:14px}.answer:after{display:table;content:"";clear:both}a{color:#ace6cd}.hidden{display:none!important}.setup{margin-top:6px}.tag{display:inline-block;color:#b8dbc9;font-size:12px;margin-bottom:8px}.note{font-size:12px;color:#aeb3bf;line-height:1.6}
</style></head><body><main class="wrap"><h1>猜歌練習機 🎧</h1><div class="subtitle">一個網站，練習不同歌手的歌曲。🎶</div>
<section class="card"><div class="small muted" style="margin-bottom:8px">猜歌模式</div><div class="row" style="margin-bottom:12px"><button id="practice" class="primary" type="button">🎧 自由練習（10 秒）</button><button id="challenge" type="button">🔥 1 秒挑戰</button></div><div class="row" style="align-items:center"><div><div class="small muted">這題已開放片段</div><div id="duration" class="large">10 秒</div></div><div><div class="small muted">已完成題數</div><div id="score" class="large">0</div></div></div><div class="progress"><div id="progress"></div></div><div class="row"><button id="play" class="primary" disabled>▶ 播放</button><button id="more" disabled>＋5 秒</button><button id="skip" disabled>略過／看答案</button></div><div class="status muted" id="playStatus">載入後開始猜歌 🎶</div></section>
<section class="card"><div style="font-weight:700">選出歌名</div><div class="small muted" style="margin:6px 0 10px">輸入部分歌名，點下方候選答案，不需要盲打。</div><input id="search" placeholder="例如：fire、under、war…" autocomplete="off" disabled><div id="choices" class="choices"></div><div class="row" style="margin-top:12px"><button id="submit" class="primary" disabled>提交答案</button><button id="next" disabled>下一題 ↻</button></div><div id="feedback" class="status"></div><div id="answer" class="answer hidden"><img id="cover" alt="專輯封面"><div id="song" style="font-weight:750;font-size:20px"></div><div class="small muted" id="album"></div><div class="small" style="margin-top:8px"><a id="store" target="_blank" rel="noopener">查看歌曲來源</a></div></div></section><section class="card"><span class="tag">音源設定</span><div class="small muted">貼上歌曲資料服務網址（Cloudflare Worker）。想玩其他團時，可以換成對應題庫的服務網址。</div><div class="setup row" style="margin-top:10px"><input id="endpoint" type="url" placeholder="https://你的服務.workers.dev"><button id="load" class="primary" style="flex:0 0 94px">載入</button></div><div id="status" class="status muted">尚未載入歌曲。首次輸入網址後按載入即可；下次開啟會記住網址並自動載入。</div></section>
<p class="note">歌曲來自你設定的音源服務，試聽片段長度與可用性依來源而定。本站不儲存音檔。</p><audio id="audio" preload="metadata"></audio></main>
<script>
'use strict';const $=id=>document.getElementById(id);const audio=$('audio');let songs=[],current=null,secs=10,done=0,selected=null,answered=false,timer=null,run=0,history=[],mode='practice';
function msg(t){$('status').textContent=t}function stop(){clearTimeout(timer);audio.pause()}function normalize(s){return String(s||'').normalize('NFKC').toLocaleLowerCase().replace(/\s+/g,'').trim()}function title(s){return String(s.title||s.trackName||'')}function resetRound(){stop();run++;selected=null;answered=false;secs=mode==='practice'?10:1;$('duration').textContent=secs+' 秒';$('progress').style.width=(secs/30*100)+'%';$('more').textContent=mode==='practice'?'＋5 秒':'＋1 秒';$('search').value='';$('search').disabled=false;$('submit').disabled=true;$('next').disabled=true;$('more').disabled=false;$('play').disabled=false;$('skip').disabled=false;$('answer').classList.add('hidden');$('feedback').textContent='';$('playStatus').textContent=mode==='practice'?'準備好了，先聽 10 秒 🎶':'準備好了，播放第一秒！';drawChoices()}
function next(){if(!songs.length)return;let pool=songs.filter(x=>!history.includes(x.id));if(!pool.length){history=[];pool=[...songs]}current=pool[Math.floor(Math.random()*pool.length)];history.push(current.id);audio.src=current.previewUrl;audio.load();resetRound()}
function drawChoices(){const needle=normalize($('search').value);const filtered=songs.filter(s=>!needle||normalize(title(s)).includes(needle)).slice(0,50);$('choices').replaceChildren();for(const item of filtered){const b=document.createElement('button');b.className='choice'+(selected?.id===item.id?' selected':'');b.textContent=title(item);b.disabled=answered;b.onclick=()=>{selected=item;$('search').value=title(item);$('submit').disabled=false;drawChoices()};$('choices').appendChild(b)}if(!filtered.length){$('choices').textContent='找不到符合的歌名'}}
function reveal(correct){stop();answered=true;$('answer').classList.remove('hidden');$('song').textContent=title(current);$('album').textContent=current.album||'';$('cover').src=current.artwork||'';$('store').href=current.storeUrl||'https://music.apple.com/';$('feedback').textContent=correct===null?'答案是：'+title(current):correct?'🎉 答對！':'答案是：'+title(current);if(correct){done++;$('score').textContent=done}$('next').disabled=false;$('play').disabled=true;$('more').disabled=true;$('skip').disabled=true;$('search').disabled=true;$('submit').disabled=true;drawChoices()}
async function play(){if(!current||answered)return;stop();const thisRun=run;try{if(audio.readyState<1){await new Promise((resolve,reject)=>{const ok=()=>{cleanup();resolve()},bad=()=>{cleanup();reject(Error('音源無法載入'))},cleanup=()=>{audio.removeEventListener('loadedmetadata',ok);audio.removeEventListener('error',bad)};audio.addEventListener('loadedmetadata',ok,{once:true});audio.addEventListener('error',bad,{once:true});setTimeout(()=>{cleanup();reject(Error('音源逾時'))},10000)})}if(thisRun!==run)return;const max=Math.max(0,(audio.duration||30)-25.3);const position=current._start??(current._start=Math.random()*max);audio.currentTime=position;await audio.play();$('playStatus').textContent=`正在播放 ${secs} 秒…`;timer=setTimeout(()=>{audio.pause();$('playStatus').textContent='還想再聽嗎？可以增加時間 👀'},secs*1000)}catch(err){$('playStatus').textContent='音源播放失敗：'+err.message}}
$('load').onclick=async()=>{const url=$('endpoint').value.trim().replace(/\/+$/,'');if(!/^https:\/\//.test(url)){msg('請先貼入 https:// 開頭的服務網址');return}msg('正在讀取歌曲…');$('load').disabled=true;try{const res=await fetch(url+'/songs',{cache:'no-store'});if(!res.ok)throw Error('服務回應 '+res.status);const raw=await res.json();const items=Array.isArray(raw)?raw:raw.songs;if(!Array.isArray(items))throw Error('題庫格式錯誤');songs=items.filter(x=>x.previewUrl&&title(x)).map((x,i)=>({...x,id:x.id||i,title:title(x)}));const dedup=new Map();for(const s of songs)if(!dedup.has(normalize(s.title)))dedup.set(normalize(s.title),s);songs=[...dedup.values()];if(!songs.length)throw Error('沒有可播的歌曲');msg(`載入 ${songs.length} 首歌曲！`);try{localStorage.setItem('guess_song_endpoint',url)}catch{};done=0;history=[];$('score').textContent='0';next()}catch(err){msg('載入失敗：'+err.message)}finally{$('load').disabled=false}};
$('play').onclick=play;
function setMode(value){mode=value;$('practice').className=value==='practice'?'primary':'';$('challenge').className=value==='challenge'?'primary':'';if(current)resetRound();try{localStorage.setItem('guess_song_mode',mode)}catch{}}
$('practice').onclick=()=>setMode('practice');$('challenge').onclick=()=>setMode('challenge');
$('more').onclick=()=>{const limit=mode==='practice'?25:10;secs=Math.min(limit,secs+(mode==='practice'?5:1));$('duration').textContent=secs+' 秒';$('progress').style.width=(secs/30*100)+'%';$('more').disabled=secs>=limit;$('playStatus').textContent='已增加到 '+secs+' 秒，按播放重聽同一段'};$('skip').onclick=()=>reveal(null);$('search').oninput=()=>{selected=null;$('submit').disabled=true;drawChoices()};$('submit').onclick=()=>{if(selected)reveal(normalize(selected.title)===normalize(current.title))};$('next').onclick=next;try{
  const saved=localStorage.getItem('guess_song_endpoint')||localStorage.getItem('andteam_endpoint')||'';
  $('endpoint').value=saved;
  setMode(localStorage.getItem('guess_song_mode')||localStorage.getItem('andteam_mode')||'practice');
  if(saved) $('load').click();
}catch{setMode('practice')}
</script></body></html>
